<template>
   
    <!--No Change -->
    <template if:true={noChange}>
          <lightning-quick-action-panel header={productNameValue}>
            <h4 class="slds-text-align_center slds-p-around_large slds-p-bottom_large slds-p-top_large" style="background-color:#F88F34; padding: 2px;"> No Product field changes have been detected from PIM Integration</h4>
            <div slot="footer" class="slds-p-bottom_large">
            </div>
        </lightning-quick-action-panel>
    </template>
    <!-- Change  IN Product START--->
    <template if:true={changeInProduct}>
        <c-pim-product-change-type  record-id={recordId} differences={differences} onclose={closeQuickAction} product-id={productId} onpublishsuccess={handlePublishSuccess}></c-pim-product-change-type>
    </template>
    <!-- NEW Product-->
    <template if:true={newProduct}>
        <c-pim-new-product record-id={recordId} onclose={closeQuickAction} product-id={productId}></c-pim-new-product>
    </template>
</template>
