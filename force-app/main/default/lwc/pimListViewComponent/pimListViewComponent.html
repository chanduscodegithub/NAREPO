<template>
    <lightning-card class="outer-card">
        <div class="header-title">
            <h1>Review and Publish</h1>
        </div>
        <div class="header-t">
            <h3>Select one or more products to review and publish</h3>
        </div>
        <div class="slds-modal__container mainContainer">
            <div>
                <!-- <p style="text-align:right"><b style="color:#ff0000;background:#ffff00">Please complete the Deactivation publish process before making any further updates to the Product Master.</b></p> -->
                <div class="toolbar">
                    <span class="selected-filter">{selectedFilter}</span>
                    <lightning-button-menu alternative-text="Filter Type" icon-name="utility:filterList"
                        onselect={handleFilterMenuSelect} menu-alignment="right" class="filter-btn">
                        <!--<lightning-menu-item value="New Product" label="New Product">
                        </lightning-menu-item>
                       <lightning-menu-item value="Change in Product" label="Change in Product">
                        </lightning-menu-item>
                        <lightning-menu-item value="Deactivation" label="Deactivation">
                        </lightning-menu-item>-->
                        <template for:each={filterOptions} for:item="option">
                            <lightning-menu-item key={option.value} value={option.value} label={option.label}>
                            </lightning-menu-item>
                        </template>
                    </lightning-button-menu>
                </div>
                <!-- <template if:true={products.length}> -->
                <div class="slds-p-bottom_small">
                    <div class="table-border-wrapper">
                        <template if:true={isLoading}>
                            <div class="slds-align_absolute-center slds-p-around_large">
                                <lightning-spinner alternative-text="Loading" size="medium">
                                </lightning-spinner>
                            </div>
                        </template>
                        <template if:false={isLoading}>
                            <lightning-datatable key-field="Id" data={products} columns={columns}
                                selected-rows={selectedRowIds} onrowselection={handleRowSelection}>
                            </lightning-datatable>
                        </template>


                        <!-- </template> -->
                        <template if:false={products.length}>
                            <p class="slds-p-around_large slds-text-align_center">No data found</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>
        <!--template for popup bulk publish and insert-->
        <!--<template if:true={summaryOfProducts}>-->
        <template if:true={showModal}>
            <section role="dialog" style="display:flex" tabindex="-1" aria-modal="true"
                class="slds-modal slds-fade-in-open">
                <!-- <div style="margin:auto; max-height:75%;" class="slds-modal__container custom-container"> -->
                <div style="margin:auto;height: 90%;" class="slds-modal__container containerPopUp">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            {modalHeader}
                        </h2>


                    </header>



                    <div class="slds-modal__content slds-p-around_medium ">


                        <template if:true={isChangeReview}>
                            <div class="slds-m-bottom_small">
                                <p>Following Product field changes have been identified through the PIM Integration.
                                    Please review and publish
                                    the changes to update MERIT Product.</p>
                            </div>
                            <template if:true={currentRecordDiff}>
                                <table
                                    class="slds-text-body_small slds-table slds-border_left slds-border_right slds-table--bordered  slds-table--resizable-cols slds-table--fixed-layout custom-table">
                                    <tbody>
                                        <tr>
                                            <th class="slds-border_right header-color slds-p-around_medium"> PIM</th>
                                            <th class="header-color slds-p-around_medium">Merit</th>
                                        </tr>
                                        <template for:each={currentRecordDiff.diffs} for:item="row">
                                            <tr key={row.stageField} class="row-divider">
                                                <td class="slds-border_right">
                                                    <div class="cell">
                                                        <div class="label">{row.stageLabel}</div>
                                                        <div class="value">{row.stageValue}</div>
                                                    </div>
                                                </td>
                                                <td>
                                                    <div class="cell">
                                                        <div class="label">{row.prodLabel}</div>
                                                        <div class="value">{row.prodValue}</div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <!-- <template if:true={hasDisplayOrderChangeBulk}>
                                    <div class="sticky slds-m-top_medium">
                                        Changing the Product Display Order will trigger updates
                                        for all affected products, starting from item &nbsp;
                                        <strong>{pimStageRecord.Product_Display_Order_Stage__c}</strong>.
                                    </div>
                                </template> -->
                            </template>
                            <template if:true={hasDisplayOrderChangeBulk}>
                                <div class="sticky slds-m-top_medium">
                                    Changing the Product Display Order will trigger updates
                                    for all affected products, starting from item &nbsp;
                                    <strong>{pimStageRecord.Product_Display_Order_Prod__c}</strong>.
                                </div>
                            </template>
                        </template>
                        <template if:true={isNewProductReview}>

                            <template if:true={pimStageRecord}>

                                <div class="slds-m-bottom_small">
                                    <p class='slds-p-around_medium'>A New Product has been detected through PIM Integration. Please review it. Once
                                        Published,
                                        the Product will be created in Merit.</p>
                                </div>
                                 <!-- <div class="section-title">PIM Product Details (Stage)</div> -->
                                <template if:true={isLoading}>
                                    <div class="slds-align_absolute-center slds-p-around_large">
                                        <lightning-spinner alternative-text="Loading" size="medium">
                                        </lightning-spinner>
                                    </div>
                                </template>
                                <template if:false={isLoading}>
                                    <table
                                        class="slds-table  slds-table_fixed-layout full-border-table">
                                        <tbody>
                                            

                                            <!-- PIM DETAILS -->
                                            <tr class="section-row">
                                    <td colspan="2">PIM Product Details (Stage)</td>
                                </tr>
                                            <tr>
                                                <td>
                                                    <div class="label">PIM ID (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_ID_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">PIM Parent ID (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_Parent_ID_Stage__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">PIM Name (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_Name_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">PIM Parent Name (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_Parent_Name_Stage__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">PIM SME Name (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_SME_Name_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Program Code (Stage)</div>
                                                    <div class="value">{pimStageRecord.Program_Code_Stage__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">PIM ID Composite (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_ID_Composite_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Supplier Code (Stage)</div>
                                                    <div class="value">{pimStageRecord.Supplier_Code_Stage__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">PIM Availability (Stage)</div>
                                                    <div class="value">{pimStageRecord.PIM_Availability_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">UHC NA Standard impl. Lead Time (Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.NAStandardImplementationLeadTime_Stage__c}</div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <div class="label">Surest Implementation Lead Time(Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.Surest_Implementation_Lead_Time_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Standard Implementation Lead Time (Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.Standard_Implementation_LeadTime_Stage__c}</div>
                                                </td>
                                            </tr>
                                            <!-- <tr>
                                                 <td>
                                                    <div class="label">Standard Implementation Lead Time (Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.Standard_Implementation_LeadTime_Stage__c}</div>
                                                </td>
                                                <td>
                                                </td>
                                            </tr> -->

                                            <!-- MERIT PRODUCT DETAILS -->
                                            <tr class="section-row">
                                                <td colspan="2">Merit Product Details (Stage)</td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Funding Type (Stage)</div>
                                                    <div class="value">{pimStageRecord.Funding_Type_Stage__c}</div>
                                                    <!-- <template if:true={fieldErrors.Funding_Type__c}>
                                                                <div class="error">{fieldErrors.Funding_Type__c}</div>
                                                            </template> -->
                                                </td>
                                                <td>
                                                    <div class="label">Product Line (Stage)</div>
                                                    <div class="value">{pimStageRecord.Product_Line_Stage__c}</div>
                                                    <!-- <template if:true={fieldErrors.Product_Line__c}>
                                                                <div class="error">{fieldErrors.Product_Line__c}</div>
                                                            </template> -->
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Product Code (Stage)</div>
                                                    <div class="value">{pimStageRecord.Product_Code_Stage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Level 2 Options (Stage)</div>
                                                    <div class="value">{pimStageRecord.Level_2_Options_Stage__c}</div>
                                                    <!-- <template if:true={fieldErrors.Level_2_Options__c}>
                                                                <div class="error">{fieldErrors.Level_2_Options__c}</div>
                                                            </template> -->
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Active (Stage)</div>
                                                    <div class="value">{pimStageRecord.IsActiveStage__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Surest Applicable Products (Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.Surest_Applicable_Products_Stage__c}
                                                    </div>
                                                    <!-- <template if:true={fieldErrors.Surest_Applicable_Products__c}>
                                                                <div class="error">{fieldErrors.Surest_Applicable_Products__c}</div>
                                                            </template> -->
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Product Family (Stage)</div>
                                                    <div class="value">{pimStageRecord.Product_Family_Stage__c}</div>
                                                    <!-- <template if:true={fieldErrors.Family}>
                                                                <div class="error">{fieldErrors.Family}</div>
                                                            </template> -->
                                                </td>
                                                <td>
                                                    <div class="label">CPW Applicable Product? (Stage)</div>
                                                    <div class="value">{pimStageRecord.CPW_Applicable_Product_Stage__c}
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td>
                                                    <div class="label">Underwriting Validation (Stage)</div>
                                                    <div class="value">{pimStageRecord.Underwriting_Validation__c}</div>
                                                </td>

                                                <!-- <td>
                                                    <div class="label">Standard Implementation Lead Time (Stage)</div>
                                                    <div class="value">
                                                        {pimStageRecord.Standard_Implementation_LeadTime_Stage__c}</div>
                                                </td> -->
                                                <td>
                                                    <div class="label">Eligible for Sales Incentives (Stage)</div>
                                                    <div class="value">{pimStageRecord.Eligible_for_Sales_Incentives__c}
                                                    </div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td></td>
                                                <td>
                                                    <div class="label">SFGO Applicable Product? (Stage)</div>
                                                    <div class="value">{pimStageRecord.SFGO_Applicable_Product_Stage__c}
                                                    </div>
                                                </td>
                                            </tr>

                                            <!-- STEPWISE -->
                                            <tr class="section-row">
                                                <td colspan="2">Merit Product Details (IC, StepWise)</td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Considered for StepWise</div>
                                                    <div class="value">
                                                        {pimStageRecord.Considered_For_StepWise_Integration__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Do Not Include in Total</div>
                                                    <div class="value">{pimStageRecord.Do_Not_Include_in_Total__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">Distribution Type Flag</div>
                                                    <div class="value">{pimStageRecord.Distribution_Type_Flag__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Key Growth Drivers</div>
                                                    <div class="value">{pimStageRecord.Key_Growth_Drivers__c}</div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">StepWise Product Name</div>
                                                    <div class="value">{pimStageRecord.StepWise_Product_Name__c}</div>
                                                </td>
                                                <!-- <td>
                                                    <div class="label">Eligible for Sales Incentives</div>
                                                    <div class="value">{pimStageRecord.Eligible_for_Sales_Incentives__c}
                                                    </div>
                                                </td> -->
                                                 <td>
                                                    <div class="label">Enterprise Growth Product</div>
                                                    <div class="value">{pimStageRecord.Enterprise_Growth_Product__c}
                                                    </div>
                                                </td>
                                            </tr>

                                            <tr>
                                                <td>
                                                    <div class="label">StepWise Product RowID</div>
                                                    <div class="value">{pimStageRecord.StepWise_Product_RowID__c}</div>
                                                </td>
                                                <!-- <td>
                                                    <div class="label">Enterprise Growth Product</div>
                                                    <div class="value">{pimStageRecord.Enterprise_Growth_Product__c}
                                                    </div>
                                                </td> -->
                                                 <td>
                                                    <div class="label">Reporting Product Type</div>
                                                    <div class="value">{pimStageRecord.Reporting_Product_Type__c}</div>
                                                </td>
                                            </tr>

                                            <!-- <tr>
                                                <td>
                                                    <div class="label">Underwriting Validation</div>
                                                    <div class="value">{pimStageRecord.Underwriting_Validation__c}</div>
                                                </td>
                                                <td>
                                                    <div class="label">Reporting Product Type</div>
                                                    <div class="value">{pimStageRecord.Reporting_Product_Type__c}</div>
                                                </td>
                                            </tr> -->

                                            <tr>
                                                <td>
                                                    <div class="label">Product Display Order (Stage)</div>
                                                    <div class="value">{pimStageRecord.Product_Display_Order_Stage__c}
                                                    </div>
                                                </td>
                                                <td></td>
                                            </tr>

                                        </tbody>
                                    </table>
                                    <!-- <template if:true={hasDisplayOrderForCreateBulk}>
                                        <div class="sticky slds-m-top_medium">
                                            Creating this Product will trigger Product Display Order updates
                                            for all affected products, starting from item &nbsp;
                                            <strong>{pimStageRecord.Product_Display_Order_Stage__c}</strong>.
                                        </div>
                                    </template> -->
                                </template>
                                <template if:true={hasDisplayOrderForCreateBulk}>
                                    <div class="sticky slds-m-top_medium">
                                        Creating a new Product will trigger updates to the Product Display Order for all impacted products, starting from item &nbsp;
                                        <strong>{pimStageRecord.Product_Display_Order_Stage__c}</strong>.
                                    </div>
                                </template>
                            </template>

                            <!-- </div> -->

                            <!-- </div> -->
                            <!-- </section>-->

                            <!-- Backdrop -->
                            <!-- <div class="slds-backdrop slds-backdrop_open"></div> -->
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <div class="footer-bar">
                            <lightning-button label="Remove" variant="destructive" onclick={handleRemove}>
                            </lightning-button>

                            <div class="footer-center">
                                <lightning-button label="Previous" onclick={handlePrevious} disabled={isFirst}>
                                </lightning-button>
                                <span class="product-counter slds-p-top_x-small">
                                        {productCounterLabel}
                                    </span>
                                <lightning-button label="Next" onclick={handleNext} disabled={isLast}>
                                </lightning-button>
                            </div>

                            <div class="footer-right">
                                <lightning-button label="Cancel" variant="neutral" onclick={hideModal}>
                                </lightning-button>
                                <template if:true={isLast}>
                                    <lightning-button label={primaryActionLabel} variant="brand"
                                        onclick={handlePublish}>
                                    </lightning-button>
                                </template>
                            </div>
                        </div>


                    </footer>
                </div>
            </section>

            <!-- Backdrop -->
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- </template> -->
        <!---->
        <div class="footer">
            <div class="slds-m-top_medium  slds-text-align_right footer-right-cancel">
                <lightning-button class="slds-p-right_medium" variant="neutral" label="Cancel" onclick={handleCancel}>
                </lightning-button>
                <lightning-button label="Review and Publish" variant="brand" onclick={handleReview}
                    disabled={isReviewDisabled}>
                </lightning-button>

            </div>

        </div>
    </lightning-card>
</template>
