<template>
    <!-- <lightning-card> -->
    <div class="slds-modal__container">


        <!-- <div slot="title" class="slds-align_absolute-center">
                <h2 class="slds-text-heading_medium">Prospect AI Summary</h2>
            </div> -->
        <header class="slds-modal__header">
            <div class="summary-header">
                <div class="header-left"></div>

                <h2 class="pop_Up_Heading">Prospect AI Summary</h2>
                <div class="header-left"></div>
            </div>
        </header>
        <div class="slds-modal__content slds-p-around_medium">



            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Generating Summary">
                </lightning-spinner>
            </template>
            <template if:false={isLoading}>
                <div class="filter-bar">
                    <div class="filter-group">
                        <span class="filter-label">
                            <i class="ti ti-target" aria-hidden="true"></i> Target
                        </span>
                        <lightning-combobox class="slds-p-right_large" value={selectVal} label="Select a product"
                            options={productOptions} onchange={handleChange} variant="label-hidden" disabled>
                        </lightning-combobox>
                    </div>
                    <!-- <p><b>Tier</b></p> -->
                    <div class="filter-group">
                        <span class="filter-label slds-p-left_small">
                            <i class="ti ti-target" aria-hidden="true"></i> Tier
                        </span>
                        <lightning-combobox class="slds-p-left_small slds-p-right_large" name="Company_Tier_Medical__c"
                            placeholder="Choose Tier..." label="Tier" options={options} value={value}
                            onchange={handleChange} variant="label-hidden"></lightning-combobox>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">
                            <i class="ti ti-target" aria-hidden="true"></i> Date Range
                        </span>

                        <lightning-combobox class="slds-p-right_large" value={selectDateVal}
                            label="Select the Date Range" options={dateOptions} onchange={handleDateChange}
                            variant="label-hidden">
                        </lightning-combobox>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">
                            <i class="ti ti-target" aria-hidden="true"></i> Users
                        </span>
                        <div class="user-dropdown-container" onmouseleave={handleMouseLeave}>

                            <lightning-input style="border:1px solid black" label="Users" value={selectedUsersLabel}
                                readonly onclick={toggleDropdown} variant="label-hidden">
                            </lightning-input>
                            <template if:true={showDropdown}>
                                <div class="dropdown">
                                    <template for:each={userOptions} for:item="user">
                                        <div key={user.value} class="slds-p-around_x-small">

                                            <lightning-input type="checkbox" label={user.label} checked={user.selected}
                                                data-value={user.value} onchange={handleUserSelection}
                                                disabled={user.disabled}>
                                            </lightning-input>

                                        </div>

                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="filter-btn-wrap">
                        <button class="generate-summary-btn" onclick={handleGenerateSummary} disabled={isGenerating}>
                            <lightning-icon icon-name="utility:agent_astro" size="small" alternative-text="Agent Astro">
                            </lightning-icon>
                            <span class="button-text">Generate Summary</span>
                        </button>
                    </div>
                    <!-- <div class="header-right">
                    <button class="generate-summary-btn" onclick={handleGenerateSummary} disabled={isGenerating}>
                        <lightning-icon icon-name="utility:agent_astro" size="small"
                            alternative-text="Agent Astro"></lightning-icon>
                        <span class="button-text">Generate Summary </span>
                    </button>
                </div> -->


                </div>

                <lightning-tabset onselect={handleTabChange}>

                    <!-- SVP Tab -->
                    <template if:true={showSVPTab}>
                        <lightning-tab label="SVP" value="SVP" onactive={handleTabChange}>

                            <div class="tiles-grid">
                                <template for:each={filteredLabels} for:item="label">
                                    <div key={label} class="tile-card">

                                        <div class="tile-header">
                                            <span class="tile-name">
                                                {label}
                                            </span>
                                        </div>

                                        <div class="tile-body">
                                            <div class="split-top">
                                                <div class="metric-chip">
                                                    <span class="metric-val">2000</span>
                                                    <span class="metric-lbl">Total Engagements/Outreach</span>
                                                </div>
                                                <div class="metric-chip">
                                                    <span class="metric-val">100</span>
                                                    <span class="metric-lbl">Engagement Effectiveness Score</span>
                                                </div>
                                                <!-- Top Engaged Accounts -->
                                                <div class="tile-section">
                                                    <div class="section-head section-head--green">
                                                        <span class="arrow">↑</span> Top Engaged Accounts
                                                    </div>
                                                    <ul class="bullet-list bullet-list--green">
                                                        <!-- <template for:each={tile.summary.topEngagedAccounts} for:item="item">
                            <li key={item}>{item}</li>
                        </template> -->
                                                        <li>Acme Corp</li>
                                                        <li>Horizon Group Corp</li>
                                                        <li>Global tech Corp</li>
                                                    </ul>
                                                </div>

                                                <!-- Top Channels -->
                                                <div class="tile-section">
                                                    <div class="section-head section-head--green">
                                                        <span class="arrow">↑</span> Top Channels
                                                    </div>
                                                    <ul class="bullet-list bullet-list--green">
                                                        <li>Meetings</li>
                                                        <li>webinar</li>
                                                        <li>Newsletters</li>

                                                        <!-- <template for:each={tile.summary.topChannels} for:item="item">
                            <li key={item}>{item}</li>
                        </template> -->
                                                    </ul>
                                                </div>

                                                <div class="tile-section">
                                                    <div class="section-head section-head--blue">
                                                        Most Engaged Contacts
                                                    </div>
                                                    <ul class="bullet-list bullet-list--blue">
                                                        <li>Jahn doe</li>
                                                        <li>Mark smith doe</li>
                                                        <li>Lisa Ray doe</li>
                                                        <!-- <template for:each={tile.summary.contacts} for:item="item">
                            <li key={item}>{item}</li>
                        </template> -->
                                                    </ul>
                                                </div>

                                                <!-- Low Engaged Accounts -->
                                                <div class="tile-section">
                                                    <div class="section-head section-head--red">
                                                        <span class="arrow">↓</span> Low Engaged Accounts
                                                    </div>
                                                    <ul class="bullet-list bullet-list--red">
                                                        <!-- <template for:each={tile.summary.lowEngagedAccounts} for:item="item">
                            <li key={item}>{item}</li>
                        </template> -->
                                                        <li>Jahn doe</li>
                                                        <li>Mark smith doe</li>
                                                        <li>Lisa Ray doe</li>
                                                    </ul>
                                                </div>

                                                <!-- Low Channels -->
                                                <div class="tile-section">
                                                    <div class="section-head section-head--red">
                                                        <span class="arrow">↓</span> Low Channels
                                                    </div>
                                                    <ul class="bullet-list bullet-list--red">
                                                        <li>Linkeidn</li>
                                                        <li>webinar</li>
                                                        <li>Newsletters</li>
                                                        <!-- <li>LinkedIn</li>
                                                <li>Mails</li> -->
                                                        <!-- <template for:each={tile.summary.lowChannels} for:item="item">
                            <li key={item}>{item}</li>
                        </template> -->
                                                    </ul>
                                                </div>


                                                <!-- <div class="channel-mix">
                                                    <template for:each={tile.summary.channelMix} for:item="mix">
                                                        <div key={mix.label} class="mix-row">
                                                            <span class="mix-label">{mix.label}</span>
                                                            <div class="mix-track">
                                                                 <div class="mix-fill" style={mix.style}></div> 
                                                            </div>
                                                            <span class="mix-pct">{mix.pct}%</span> 
                                                        </div>
                                                    </template> 
                                                </div>-->



                                            </div>




                                        </div>








                                    </div>


                            </div>


                    </template>
                    <template if:false={filteredLabels.length}>
                        <p>No users selected.</p>
                    </template>
        </div>
        </lightning-tab>
</template>

<!-- Quad4 Tab -->
<template if:true={showQuad4Tab}>
    <lightning-tab label="Quad4" value="Quad4" onactive={handleTabChange}>
        <!-- <template if:true={noTiles}>
                                <p class="no-tiles">No tiles available.</p>
                            </template> -->
        <div class="tiles-grid">
            <template for:each={filteredLabels} for:item="label">

                <div key={label} class="tile-card">

                    <div class="tile-header">
                        <span class="tile-name">
                            {label}
                        </span>
                    </div>

                    <div class="tile-body">
                        <!-- <template if:true={tile.isLoading}>
                                                <lightning-spinner size="small"
                                                    alternative-text="Loading"></lightning-spinner>
                                            </template> -->
                        <!-- <template if:false={tile.isLoading}> -->
                        <!-- <template if:true={tile.summary}> -->
                        <div class="tile-fields">
                            <div class="tile-field">
                                <span class="tile-field-label">Total Engagements/Outreach</span>
                                <!-- <span class="tile-field-value">{tile.summary.totalEngagements}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Engagement Effectiveness Score</span>
                                <!-- <span class="tile-field-value">{tile.summary.engagementScore}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Top Engaged Accounts</span>
                                <!-- <span  class="tile-field-value">{tile.summary.topEngagedAccounts}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Top Channels</span>
                                <!-- <span class="tile-field-value">{tile.summary.topChannels}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Contacts and Roles</span>
                                <!-- <span class="tile-field-value">{tile.summary.contactsAndRoles}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Low Engaged Accounts</span>
                                <!-- <span class="tile-field-value">{tile.summary.lowEngagedAccounts}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Low Channels</span>
                                <!-- <span class="tile-field-value">{tile.summary.lowChannels}</span> -->
                            </div>
                            <div class="tile-field">
                                <span class="tile-field-label">Channel Mix</span>
                                <!-- <span class="tile-field-value">{tile.summary.channelMix}</span> -->
                            </div>
                        </div>

                        <div class="tile-summary-section">
                            <span class="tile-field-label">Summary</span>
                            <!-- <p class="tile-summary-text">{tile.summary.summaryText}</p> -->
                        </div>
                        <!-- </template> -->
                        <!-- <template if:false={tile.summary}>
                                                    <p class="tile-empty">No summary available.
                                                    </p>
                                                </template> -->
                        <!-- </template> -->
                    </div>

                </div>

            </template>
            <template if:false={filteredLabels.length}>
                <p>No users selected.</p>
            </template>
        </div>
    </lightning-tab>
</template>

</lightning-tabset>



</template>
</div>

            label="SVP Top Targets">
        </lightning-pill> -->

    <span class="slds-pill__label">
        Direct Marketing  Lead
    </span>
</div> -->

</div>
