<template>

    <template if:true={showModal}>
      
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">Confirm Reprocessing</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium slds-text-align_center">
                    <p>
                        This will reprocess the failed chunks for this RFP. You will receive an email notification once it completes.
                    </p>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" class="slds-m-right_x-small" onclick={closeModal}></lightning-button>
                    <lightning-button variant="brand" label="Continue" onclick={handleReprocess}></lightning-button>
                </footer>
         
    </template>
</template>
