        <template if:true={showCopyPopup}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            Confirm Copy from Last Year
                        </h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        This action will copy last year’s values to the next year for Optional Products.
                        If a product is sold or termed for the next year, the system will identify the
                        existing MA and update it as Yes/No respectively during the copy process.
                        You can manually edit all responses after copying.

                        <br/><br/>
                        Do you wish to continue?
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={cancelCopy}>
                        </lightning-button>

                        <lightning-button
                            variant="brand" class="slds-m-left_small"
                            label="Continue"
                            onclick={confirmCopy}>
                        </lightning-button>
                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
